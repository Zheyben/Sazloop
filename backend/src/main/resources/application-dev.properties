# =============================================================
# application-dev.properties — Perfil de DESARROLLO
#
# Se activa cuando spring.profiles.active=dev
# Usa H2: una base de datos en memoria RAM que no necesita
# instalación. Spring Boot la levanta automáticamente.
#
# PROPÓSITO: permitir verificar que el backend arranca y
# compila correctamente SIN necesitar MySQL instalado.
# =============================================================

# -------------------------------------------------------------
# DATASOURCE — FUENTE DE DATOS (H2 en memoria)
#
# url:
#   jdbc:h2:mem:sazloop
#     └─ "mem" = in-memory (vive en RAM, desaparece al parar)
#   DB_CLOSE_DELAY=-1 → mantiene la BD activa mientras la app corre
#   DB_CLOSE_ON_EXIT=FALSE → no cierra la BD al salir de la JVM
#
# driver-class-name: el conector JDBC de H2 (incluido automáticamente)
# username/password: credenciales por defecto de H2
# -------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:sazloop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------
# CONSOLA WEB DE H2
# H2 tiene una interfaz web para ver las tablas y ejecutar
# consultas SQL directamente en el navegador.
#
# Acceso: http://localhost:8080/h2-console
# JDBC URL a usar en la consola: jdbc:h2:mem:sazloop
# -------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------
# JPA / HIBERNATE — GESTIÓN DEL ESQUEMA
#
# ddl-auto=create-drop
#   "create" → Hibernate crea todas las tablas al arrancar
#              leyendo las clases anotadas con @Entity
#   "drop"   → Hibernate elimina las tablas al apagar la app
#   Perfecto para desarrollo: siempre empieza limpio.
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
