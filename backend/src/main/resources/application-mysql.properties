# =============================================================
# application-mysql.properties — Perfil local de MySQL
#
# Se activa cuando spring.profiles.active=mysql
# Usa MySQL real. Activar cuando la base de datos esté lista.
#
# PARA ACTIVARLO:
# 1. Instalar MySQL (o XAMPP con MySQL)
# 2. Crear la base de datos: CREATE DATABASE mealflow;
#    El nombre técnico se conserva por compatibilidad con las instalaciones
#    existentes. La plataforma se llama Sazloop; este cambio no migra datos.
# 3. Cambiar en application.properties:
#       spring.profiles.active=mysql
# 4. Ajustar usuario y contraseña según tu instalación local.
# =============================================================

# -------------------------------------------------------------
# DATASOURCE — FUENTE DE DATOS (MySQL)
#
# url: jdbc:mysql://[host]:[puerto]/[nombre_base_de_datos]
#   localhost → MySQL corre en la misma máquina
#   3306      → puerto por defecto de MySQL
#   mealflow → nombre de la base de datos a crear
#
# Parámetros extra en la URL:
#   useSSL=false             → sin cifrado SSL (entorno local)
#   allowPublicKeyRetrieval=true → necesario en MySQL 8+
#   serverTimezone=America/Lima  → zona horaria correcta (Perú)
#   characterEncoding=UTF-8      → soporte para acentos y ñ
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/mealflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------
# CREDENCIALES
# Ajusta según la configuración de MySQL en tu máquina.
# En instalaciones por defecto de XAMPP: root sin contraseña.
# En instalaciones de MySQL Community: root con la contraseña
# que elegiste durante la instalación.
#
# IMPORTANTE: No subas credenciales reales al repositorio.
# Para un proyecto real se usaría variables de entorno.
# Para este proyecto académico local es aceptable.
# -------------------------------------------------------------
spring.datasource.username=${SAZLOOP_DB_USER:root}
spring.datasource.password=${SAZLOOP_DB_PASSWORD:}

# -------------------------------------------------------------
# JPA / HIBERNATE — GESTIÓN DEL ESQUEMA
#
# ddl-auto=update
#   Hibernate ajusta las tablas si detecta diferencias con
#   las clases @Entity, sin borrar los datos existentes.
#   Útil durante el desarrollo con MySQL real.
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
