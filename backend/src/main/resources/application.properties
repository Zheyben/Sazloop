# =============================================================
# application.properties — Configuración base de la aplicación
#
# Este archivo se carga SIEMPRE, independientemente del perfil.
# Define el perfil activo y la configuración común a todos
# los entornos.
# =============================================================

# -------------------------------------------------------------
# PERFIL ACTIVO
# Le dice a Spring Boot qué perfil cargar además de este.
# "dev"  → carga application-dev.properties  (H2, sin MySQL)
# "mysql" → carga application-mysql.properties (MySQL local)
#
# Para el primer avance usamos "dev".
# Cuando necesitemos probar con MySQL, cambiamos a "mysql".
# -------------------------------------------------------------
spring.profiles.active=dev

# -------------------------------------------------------------
# NOMBRE DE LA APLICACIÓN
# Aparece en los logs al arrancar. Útil para identificar
# qué servicio está corriendo.
# -------------------------------------------------------------
spring.application.name=sazloop

# -------------------------------------------------------------
# CONFIGURACIÓN DE JPA COMÚN A TODOS LOS PERFILES
#
# show-sql=true  → muestra en la consola cada consulta SQL
#                  que Hibernate genera. Muy útil para depurar.
#
# format_sql=true → formatea el SQL para que sea legible
#                   en la consola (en lugar de una sola línea).
#
# open-in-view=false → desactiva un comportamiento de Spring
#   que mantiene la sesión de base de datos abierta durante
#   toda la petición HTTP. Desactivarlo es la buena práctica
#   para evitar problemas de rendimiento y lazy loading.
# -------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# PUERTO DEL SERVIDOR
# Tomcat escuchará en el puerto 8080 por defecto.
# Los endpoints de la API estarán en http://localhost:8080/
# -------------------------------------------------------------
server.port=8080

# Tamaño permitido para los documentos privados de afiliación.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
