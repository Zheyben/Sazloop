<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazloop | Ingreso de administración</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="accesos.css">
  <script type="module" src="accesos.js"></script>
</head>
<body data-acceso="administrador">
  <a class="volver-publico" href="../index.html" aria-label="Volver al sitio público">&lt;</a>
  <main class="marco-acceso modo-administrador">
    <section class="panel-historia" aria-labelledby="titulo-historia">
      <p class="etiqueta">ADMINISTRACIÓN DE LA PLATAFORMA</p>
      <h1 id="titulo-historia">Cada local, <em>bien revisado.</em></h1>
      <p>Consulta los documentos y resuelve las solicitudes de afiliación de los establecimientos.</p>
      <span class="historia-marca" aria-hidden="true">✳</span>
    </section>
    <section class="panel-formulario" aria-labelledby="titulo-formulario">
      <div class="formulario-contenido">
        <p class="etiqueta">ACCESO DE ADMINISTRACIÓN</p>
        <h2 id="titulo-formulario">Iniciar sesión</h2>
        <p id="mensaje-acceso" role="status" aria-live="polite"></p>
        <form id="ingreso-administrador" class="formulario-acceso">
          <label>Correo institucional <input name="email" type="email" autocomplete="username" required></label>
          <label>Contraseña <input name="contrasena" type="password" autocomplete="current-password" required></label>
          <button type="submit">Ingresar</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
