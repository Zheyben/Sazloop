<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazloop | Administración</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="administrador.js"></script>
</head>
<body>
  <header class="cabecera-app"><a class="marca-app" href="../index.html"><span class="marca-icono">✳</span> Sazloop<span class="marca-punto">.</span></a><a class="enlace-cabecera" href="index.html">Cambiar acceso</a></header>
  <main class="pagina-acceso">
    <p class="etiqueta">ACCESO DE ADMINISTRACIÓN</p>
    <h1>Solicitudes <em>de los locales.</em></h1>
    <p id="mensaje" role="status" aria-live="polite"></p>
    <form id="ingresoAdmin" class="form-acceso">
      <h2>Iniciar sesión</h2>
      <label>Correo institucional <input name="email" type="email" autocomplete="username" required></label>
      <label>Contraseña <input name="contrasena" type="password" autocomplete="current-password" required></label>
      <button type="submit">Ingresar</button>
    </form>
    <section id="panelAdmin" class="panel" hidden>
      <h2>Bienvenido, <span id="nombreAdmin"></span></h2>
      <button id="salirAdmin" type="button" class="secundario">Cerrar sesión</button>
      <h3>Solicitudes pendientes</h3>
      <div id="solicitudesAdmin" class="grid" aria-live="polite"></div>
      <section id="detalleSolicitud" hidden aria-live="polite"></section>
    </section>
  </main>
</body>
</html>
