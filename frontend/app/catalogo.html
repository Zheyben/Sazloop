<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazloop | Ofertas</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="catalogo.js"></script>
</head>
<body>
  <nav id="nav" aria-label="Principal"></nav>
  <main>
    <h1>Packs sorpresa cerca de ti</h1>
    <p class="sub">Comida lista para salir de la tienda hoy, a mejor precio.</p>
    <p id="mensaje" role="status" aria-live="polite"></p>

    <form id="filtros" class="filtros">
      <label>Distrito <input name="distrito" placeholder="Miraflores"></label>
      <label>Precio máximo (S/) <input name="precioMaximo" type="number" min="0" step="0.5"></label>
      <label>Calificación mínima <input name="calificacionMinima" type="number" min="0" max="5" step="0.5"></label>
      <button type="submit">Buscar</button>
    </form>

    <section id="lista" class="grid" aria-label="Ofertas disponibles"></section>
  </main>

  <dialog id="detalle"></dialog>
</body>
</html>
