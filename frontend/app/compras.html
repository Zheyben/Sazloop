<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazloop | Mis compras</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
  <script type="module" src="portal-main.js"></script>
  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>
<body>
<!-- 1. El menú superior mantiene la consistencia bajando desde el techo -->
<header id="portal-nav" class="portal-cabecera animate__animated animate__fadeInDown"></header>

<main class="portal-principal">
  <!-- 2. El título entra desde la izquierda para continuar la fluidez de navegación -->
  <section class="titulo-pagina animate__animated animate__fadeInLeft">
    <p class="etiqueta">TU ESPACIO</p>
    <h1>Mis <em>compras.</em></h1>
    <p>Revisa lo que elegiste y tus compras anteriores en un mismo lugar.</p>
  </section>

  <p id="mensaje" role="status" aria-live="polite"></p>

  <!-- 3. El carrito sube inmediatamente. Es la prioridad visual del usuario. -->
  <section class="seccion-carrito animate__animated animate__fadeInUp" aria-labelledby="titulo-carrito">
    <div class="seccion-encabezado"><div><p class="etiqueta">ANTES DE COMPRAR</p><h2 id="titulo-carrito">Mi carrito</h2></div></div>
    <div id="carrito" aria-live="polite"></div>
  </section>

  <!-- 4. El historial sube con un segundo de retraso (delay-1s) para crear un flujo de lectura de arriba hacia abajo -->
  <section class="seccion-historial animate__animated animate__fadeInUp animate__delay-1s" aria-labelledby="titulo-historial">
    <div class="seccion-encabezado"><div><p class="etiqueta">TUS PEDIDOS</p><h2 id="titulo-historial">Historial de compras</h2></div></div>
    <div id="lista" class="grid-compras" aria-label="Compras realizadas"></div>
  </section>
</main>
</body>
</html>
