<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazloop | Mi perfil</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
  <script type="module" src="portal-main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <header id="portal-nav" class="portal-cabecera"></header>
  <main class="portal-principal">
    <section class="titulo-pagina">
      <p class="etiqueta">TU CUENTA</p>
      <h1>Mi <em>perfil.</em></h1>
      <p>Consulta y actualiza tus datos personales, tu foto y tu contraseña.</p>
    </section>
    <p id="mensaje-perfil" role="status" aria-live="polite"></p>
    <div class="perfil-layout">
      <aside class="perfil-identidad" aria-label="Tu foto de perfil">
        <div class="perfil-foto-marco">
          <img id="perfil-foto" alt="Tu foto de perfil" width="132" height="132" hidden>
          <span id="perfil-iniciales" class="perfil-iniciales" aria-hidden="true"></span>
        </div>
        <h2 id="perfil-nombre-completo"></h2>
        <p id="perfil-correo-corto"></p>
        <button id="editar-foto" type="button" class="secundario">Subir o cambiar foto</button>
        <form id="form-foto" hidden>
          <label>Foto de perfil <small>PNG o JPG, hasta 2 MB</small>
            <input name="archivo" type="file" accept="image/png,image/jpeg" required></label>
          <button type="submit">Guardar foto</button>
        </form>
      </aside>

      <div class="perfil-columna">
        <section class="perfil-datos" aria-labelledby="titulo-datos">
          <div class="perfil-datos-encabezado">
            <h2 id="titulo-datos">Datos de tu cuenta</h2>
            <button id="editar-perfil" type="button" class="secundario">Modificar información</button>
          </div>
          <dl id="datos-perfil">
            <div><dt>Nombres</dt><dd id="perfil-nombres"></dd></div>
            <div><dt>Apellidos</dt><dd id="perfil-apellidos"></dd></div>
            <div><dt>Correo</dt><dd id="perfil-email"></dd></div>
            <div><dt>Teléfono</dt><dd id="perfil-telefono"></dd></div>
            <div><dt>Contraseña</dt><dd aria-label="Contraseña protegida">••••••••</dd></div>
          </dl>
          <form id="form-perfil" hidden>
            <div class="perfil-campos">
              <label>Nombres <input name="nombres" maxlength="80" required></label>
              <label>Apellidos <input name="apellidos" maxlength="80" required></label>
              <label>Correo <input name="email" type="email" maxlength="150" required></label>
              <label>Teléfono <input name="telefono" type="tel" maxlength="20"></label>
            </div>
            <div class="perfil-acciones">
              <button id="cancelar-perfil" type="button" class="secundario">Cancelar</button>
              <button type="submit">Guardar datos</button>
            </div>
          </form>
        </section>

        <section class="perfil-datos perfil-seguridad" aria-labelledby="titulo-seguridad">
          <div class="perfil-datos-encabezado">
            <div>
              <h2 id="titulo-seguridad">Seguridad</h2>
              <p class="perfil-ayuda">Para cambiar tu contraseña necesitas escribir la actual.</p>
            </div>
            <button id="editar-contrasena" type="button" class="secundario">Cambiar contraseña</button>
          </div>
          <form id="form-contrasena" hidden>
            <div class="perfil-campos">
              <label>Contraseña actual <input name="actual" type="password" autocomplete="current-password" required></label>
              <label>Contraseña nueva <input name="nueva" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
            </div>
            <div class="perfil-acciones"><button type="submit">Cambiar contraseña</button></div>
          </form>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
