<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazloop | Mi perfil</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
  <script type="module" src="portal-main.js"></script>
</head>
<body>
  <header id="portal-nav" class="portal-cabecera"></header>
  <main class="portal-principal">
    <section class="titulo-pagina">
      <p class="etiqueta">TU CUENTA</p>
      <h1>Mi <em>perfil.</em></h1>
    </section>
    <section class="perfil-datos" aria-labelledby="titulo-datos">
      <h2 id="titulo-datos">Datos de tu cuenta</h2>
      <dl>
        <div><dt>Nombres</dt><dd id="perfil-nombres"></dd></div>
        <div><dt>Apellidos</dt><dd id="perfil-apellidos"></dd></div>
        <div><dt>Correo</dt><dd id="perfil-email"></dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
